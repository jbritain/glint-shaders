# SSBOS
# scene data
# 3x vec3 + 2x float
bufferObject.0 = 56

# COLORTEXES
size.buffer.colortex4 = 256 2
size.buffer.colortex12 = 0.5 0.5
size.buffer.colortex14 = 0.25 0.25
size.buffer.colortex15 = 0.25 0.25

# RENDER SETTINGS
separateAo = true

# UNIFORMS
uniform.vec2.resolution = vec2(viewWidth, viewHeight)
uniform.vec2.pixelSize = vec2(1.0 / viewWidth, 1.0 / viewHeight)
uniform.float.horizontalFov = 2.0 * atan(1.0 / (gbufferProjection.0.0))
uniform.float.fov = 2.0 * atan(1.0 / (gbufferProjection.0.0 * aspectRatio))

uniform.bool.isDay = sunAngle <= 0.5

variable.float.lightDirLength = sqrt((shadowLightPosition.x * shadowLightPosition.x) + (shadowLightPosition.y * shadowLightPosition.y) + (shadowLightPosition.z * shadowLightPosition.z))
uniform.vec3.lightDir = vec3(shadowLightPosition.x / lightDirLength, shadowLightPosition.y / lightDirLength, shadowLightPosition.z / lightDirLength)
uniform.vec3.sunDir   = vec3(sunPosition.x / lightDirLength, sunPosition.y / lightDirLength, sunPosition.z / lightDirLength)
uniform.vec3.moonDir = vec3(moonPosition.x / lightDirLength, moonPosition.y / lightDirLength, moonPosition.z / lightDirLength)

# xirreal sent this to the shaderlabs discord in 2021
variable.float.sunVectorX = gbufferModelViewInverse.0.0 * sunPosition.x + gbufferModelViewInverse.1.0 * sunPosition.y + gbufferModelViewInverse.2.0 * sunPosition.z
variable.float.sunVectorY = gbufferModelViewInverse.0.1 * sunPosition.x + gbufferModelViewInverse.1.1 * sunPosition.y + gbufferModelViewInverse.2.1 * sunPosition.z
variable.float.sunVectorZ = gbufferModelViewInverse.0.2 * sunPosition.x + gbufferModelViewInverse.1.2 * sunPosition.y + gbufferModelViewInverse.2.2 * sunPosition.z
variable.float.sunVectorNorm = 1.0 / sqrt((sunVectorX * sunVectorX) + (sunVectorY * sunVectorY) + (sunVectorZ * sunVectorZ))
uniform.vec3.worldSunDir = vec3(sunVectorX * sunVectorNorm, sunVectorY * sunVectorNorm, sunVectorZ * sunVectorNorm)
uniform.vec3.worldMoonDir = vec3(worldSunDir.x * -1, worldSunDir.y * -1, worldSunDir.z * -1)

#ifdef WORLD_THE_END
variable.float.shadowLightVectorX = gbufferModelViewInverse.0.0 * shadowLightPosition.x + gbufferModelViewInverse.1.0 * shadowLightPosition.y + gbufferModelViewInverse.2.0 * shadowLightPosition.z
variable.float.shadowLightVectorY = gbufferModelViewInverse.0.1 * shadowLightPosition.x + gbufferModelViewInverse.1.1 * shadowLightPosition.y + gbufferModelViewInverse.2.1 * shadowLightPosition.z
variable.float.shadowLightVectorZ = gbufferModelViewInverse.0.2 * shadowLightPosition.x + gbufferModelViewInverse.1.2 * shadowLightPosition.y + gbufferModelViewInverse.2.2 * shadowLightPosition.z
variable.float.shadowLightVectorNorm = 1.0 / sqrt((shadowLightVectorX * shadowLightVectorX) + (shadowLightVectorY * shadowLightVectorY) + (shadowLightVectorZ * shadowLightVectorZ))
uniform.vec3.worldLightDir = vec3(shadowLightVectorX * shadowLightVectorNorm, shadowLightVectorY * shadowLightVectorNorm, shadowLightVectorZ * shadowLightVectorNorm)
#else
uniform.vec3.worldLightDir = if(isDay, worldSunDir, worldMoonDir)
#endif

sliders = ROUGH_SSR_THRESHOLD

